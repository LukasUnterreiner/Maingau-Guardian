# Lighty backend. VM port 80 -> container port 8000. External access on wsvm38: port 38080 is forwarded to VM port 80.
services:
  lighty:
    build: .
    image: lighty:latest
    container_name: lighty
    restart: unless-stopped
    ports:
      - "80:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /srv/data
      RUNTIME_DIR: /srv/runtime
    volumes:
      - ./data:/srv/data:ro
      - lighty-runtime:/srv/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  # Lighty web app (Streamlit, frontend/). VM port 443 -> container 8501; on wsvm38 that is http://130.83.85.181:38443.
  # Plain HTTP on that port, no TLS. Employees sign in with a token from EMPLOYEE_TOKENS.
  lighty-ui:
    build: ./frontend
    image: lighty-ui:latest
    container_name: lighty-ui
    restart: unless-stopped
    ports:
      - "${UI_PORT:-443}:8501"
    environment:
      LIGHTY_API_URL: http://lighty:8000
      LIGHTY_ADMIN_TOKEN: ${ADMIN_TOKEN:-}
    depends_on:
      - lighty
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

volumes:
  lighty-runtime:
